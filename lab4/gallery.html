<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея — Кулініч Юлія</title>
    <link rel="stylesheet" href="css/gallery.css">
</head>
<body>

    <h1>Галерея Кулініч Юлія</h1>
    <p><a href="index.html" class="back-link">Назад на головну</a></p>

    <h2>Мої зображення</h2>

    <div class="gallery-container">
        <div class="gallery-item">
            <h3 class="img-local">Зображення у цій папці</h3>
            <img src="placeholder.png" alt="Локальне зображення з кореню">
        </div>

        <div class="gallery-item">
            <h3 class="img-folder">Зображення у папці</h3>
            <img src="images/placeholder.png" alt="Зображення з папки images">
        </div>

        <div class="gallery-item">
            <h3 class="img-online">Зображення онлайн</h3>
            <img src="https://placehold.co/1280x1024" alt="Онлайн зображення">
        </div>
    </div>

</body>
</html>
