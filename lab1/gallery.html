<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея — Кулініч Юлія</title>
    <style>
        h1 {
            text-align: center;
            font-size: 20px;
        }
        .back-link {
            font-style: italic;
        }
        h2 {
            text-align: center;
            font-size: 24px;
        }
        h3 {
            text-align: center;
        }
        h3.img-local {
            font-size: 70%;
        }
        h3.img-folder {
            font-size: 130%;
        }
        h3.img-online {
            font-size: 169%;
        }
        img {
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <h1>Галерея Кулініч Юлія</h1>
    <p><a href="index.html" class="back-link">Назад на головну</a></p>

    <h2>Мої зображення</h2>

    <h3 class="img-local">Зображення у цій папці</h3>
    <img src="placeholder.jpg" alt="Локальне зображення з кореню" width="640" height="480">

    <h3 class="img-folder">Зображення у папці</h3>
    <img src="images/placeholder.jpg" alt="Зображення з папки images" width="640" height="480">

    <h3 class="img-online">Зображення онлайн</h3>
    <img src="https://placehold.co/1280x1024" alt="Онлайн зображення" width="1280" height="1024">

</body>
</html>
